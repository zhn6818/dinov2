# DINOv2 ViT-B/14 垂直领域微调配置
# 适用于 1-2 GPU、1-3 万无标签图像的自监督微调
# 未列出的配置继承自 ssl_default_config.yaml

# ==================== 训练数据与流程 ====================
train:
  batch_size_per_gpu: 2          # 每卡 batch，显存不足可降至 1
  dataset_path: FlatFolder:root=/path/to/your/images  # 脚本会覆盖，支持单层或子文件夹
  output_dir: ./output/vitb14_finetune
  saveckp_freq: 5000             # 每 N iter 保存 checkpoint
  num_workers: 0                 # 8GB 显存建议 0，避免 fork 占显存
  OFFICIAL_EPOCH_LENGTH: 250     # 每 epoch 的 iter 数，总 iter = epochs × 此值
  cache_dataset: false           # 小数据集不缓存到内存

# ==================== 模型结构 ====================
student:
  arch: vit_base                 # ViT-B 架构
  patch_size: 14                 # ViT-B/14
  drop_path_rate: 0.3           # 随机深度，小数据集可略高防过拟合
  pretrained_weights: https://dl.fbaipublicfiles.com/dinov2/dinov2_vitb14/dinov2_vitb14_pretrain.pth  # 脚本会覆盖为本地路径

# ==================== Teacher 动量 ====================
teacher:
  momentum_teacher: 0.992        # EMA 动量，越小越适应小数据集
  warmup_teacher_temp_epochs: 20 # 温度预热 epoch 数

# ==================== 优化器 ====================
optim:
  epochs: 250                    # 总 epoch 数
  base_lr: 0.004                 # 基础学习率，会按 batch_size 缩放

# ==================== 数据增强裁剪 ====================
crops:
  global_crops_scale: [0.9, 1.0] # 全局 crop 缩放范围；金相图可改为 [0.9, 1.0] 保留更多结构
  local_crops_number: 4          # 局部 crop 数量，显存不足可降至 2
  global_crops_size: 224        # 裁剪尺寸，必须为 14 的倍数；改此值需加 --no-resume
  local_crops_size: 98          # 局部 crop 尺寸，必须为 14 的倍数

# ==================== 评估 ====================
evaluation:
  eval_period_iterations: 5000   # 每 N iter 保存 teacher 权重到 eval/

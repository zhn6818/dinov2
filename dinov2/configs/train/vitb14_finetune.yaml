# DINOv2 ViT-B/14 垂直领域微调配置
# 适用于 1-2 GPU、1-3 万无标签图像的自监督微调

dino:
  head_n_prototypes: 65536
  head_bottleneck_dim: 256
  head_nlayers: 3
  head_hidden_dim: 2048
  loss_weight: 1.0
  koleo_loss_weight: 0.1

ibot:
  loss_weight: 1.0
  mask_sample_probability: 0.5
  mask_ratio_min_max: [0.1, 0.5]
  separate_head: false
  head_n_prototypes: 65536
  head_bottleneck_dim: 256
  head_nlayers: 3
  head_hidden_dim: 2048

train:
  batch_size_per_gpu: 2          # 518 图像较大，降低 batch 避免 OOM（原 224 可用 8）
  dataset_path: FlatFolder:root=/path/to/your/images
  output_dir: ./output/vitb14_finetune
  saveckp_freq: 5000              # 更频繁保存检查点
  seed: 0
  num_workers: 0                 # 8GB 显存需设为 0，避免 fork 的 worker 继承 CUDA 占用 ~2GB
  OFFICIAL_EPOCH_LENGTH: 250      # 1-3万图像，调整 epoch 长度
  cache_dataset: false            # 小数据集不需要缓存
  centering: "centering"
  cell_augmentation: false

student:
  arch: vit_base                  # ViT-B 模型
  patch_size: 14
  drop_path_rate: 0.2             # 降低 dropout，防止小数据集过拟合
  layerscale: 1.0e-05
  drop_path_uniform: true
  pretrained_weights: https://dl.fbaipublicfiles.com/dinov2/dinov2_vitb14/dinov2_vitb14_pretrain.pth
  ffn_layer: "mlp"
  block_chunks: 0
  qkv_bias: true
  proj_bias: true
  ffn_bias: true
  num_register_tokens: 0
  interpolate_antialias: false
  interpolate_offset: 0.0
  in_chans: 3
  channel_adaptive: false

teacher:
  momentum_teacher: 0.996         # 降低动量，适应小数据集
  final_momentum_teacher: 1
  warmup_teacher_temp: 0.04
  teacher_temp: 0.07
  warmup_teacher_temp_epochs: 10  # 减少预热 epoch
  in_chans: 3
  channel_adaptive: false

optim:
  epochs: 50                      # 减少总 epoch，小数据集不需要 100
  weight_decay: 0.04
  weight_decay_end: 0.4
  base_lr: 0.002                  # 降低学习率，防止过拟合
  lr: 0.0                         # 会根据缩放规则自动设置
  warmup_epochs: 5                # 减少预热
  min_lr: 1.0e-06
  clip_grad: 3.0
  freeze_last_layer_epochs: 1
  scaling_rule: sqrt_wrt_1024
  patch_embed_lr_mult: 0.2
  layerwise_decay: 0.9
  adamw_beta1: 0.9
  adamw_beta2: 0.999

crops:
  global_crops_scale: [0.4, 1.0]  # 调整裁剪范围，更适合小数据集
  local_crops_number: 6           # 减少局部裁剪数量加快训练
  local_crops_scale: [0.05, 0.4]
  global_crops_size: 518          # 必须与官方预训练权重一致(518)，否则 pos_embed 尺寸不匹配
  local_crops_size: 98            # 必须为 patch_size(14) 的倍数，98=14*7

evaluation:
  eval_period_iterations: 5000    # 更频繁评估

# 混合精度配置（可选，需要兼容的 GPU）
compute_precision:
  grad_scaler: true
  teacher:
    backbone:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp16
        reduce_dtype: fp16
        buffer_dtype: fp32
    dino_head:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp16
        reduce_dtype: fp16
        buffer_dtype: fp32
    ibot_head:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp16
        reduce_dtype: fp16
        buffer_dtype: fp32
  student:
    backbone:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp16
        reduce_dtype: fp16
        buffer_dtype: fp32
    dino_head:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp16
        reduce_dtype: fp32
        buffer_dtype: fp32
    ibot_head:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp16
        reduce_dtype: fp32
        buffer_dtype: fp32